                <style>
                    #readme-content { line-height: 1.6; }
                    #readme-content img { max-width: 100%; height: auto; }
                    #readme-content table { border-collapse: collapse; margin: 1em auto; }
                    #readme-content th, #readme-content td { border: 1px solid #ccc; padding: 6px 12px; }
                    #readme-content th { background: #f6f8fa; }
                    #readme-content h1, #readme-content h2 { border-bottom: 1px solid #eee; padding-bottom: .3em; margin-top: 1.5em; }
                    #readme-content code { background: #f6f8fa; padding: 2px 5px; border-radius: 4px; }
                    #readme-content pre { background: #f6f8fa; padding: 1em; border-radius: 6px; overflow-x: auto; }
                    #readme-content a { color: #0969da; text-decoration: none; }
                    #readme-content a:hover { text-decoration: underline; }
                    /* kofi banner is huge at native size -> cap to badge height */
                    #readme-content img[src*="kofi"] { max-height: 36px; }
                </style>
                <script>
                    (function () {
                        var README_URL = 'https://raw.githubusercontent.com/gemilepus/Scriptboxie/refs/heads/master/README.md';
                        var el = document.getElementById('readme-content');

                        var RAW_BASE = 'https://raw.githubusercontent.com/gemilepus/Scriptboxie/master/';

                        function fixImageSrc(img) {
                            var s = img.getAttribute('src') || '';
                            if (/^https?:\/\//i.test(s)) {
                                // github.com blob URLs don't hotlink reliably -> raw URLs
                                s = s.replace(/^https:\/\/github\.com\/(.+?)\/blob\//,
                                    'https://raw.githubusercontent.com/$1/');
                            } else if (s.indexOf('//') !== 0 && s.indexOf('data:') !== 0) {
                                // relative paths (RepoRoot-based in the README) -> raw base
                                s = RAW_BASE + s.replace(/^\/+/, '');
                            }
                            img.src = s;
                        }

                        function render(markdown) {
                            el.innerHTML = marked.parse(markdown);
                            el.querySelectorAll('img').forEach(function (img) {
                                fixImageSrc(img);
                                img.style.maxWidth = '100%';
                                img.style.height = 'auto';
                            });
                        }

                        fetch(README_URL)
                            .then(function (resp) {
                                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                                return resp.text();
                            })
                            .then(render)
                            .catch(function (err) {
                                el.innerHTML = '<p align="center">Failed to load README: ' + err.message + '</p>';
                            });
                    })();
                </script>

    <script>
        jQuery(function ($) {

            $(".sidebar-dropdown > a").click(function () {
                $(".sidebar-submenu").slideUp(200);
                if (
                    $(this)
                        .parent()
                        .hasClass("active")
                ) {
                    $(".sidebar-dropdown").removeClass("active");
                    $(this)
                        .parent()
                        .removeClass("active");
                } else {
                    $(".sidebar-dropdown").removeClass("active");
                    $(this)
                        .next(".sidebar-submenu")
                        .slideDown(200);
                    $(this)
                        .parent()
                        .addClass("active");
                }
            });

            $("#close-sidebar").click(function () {
                $(".page-wrapper").removeClass("toggled");
            });
            $("#show-sidebar").click(function () {
                $(".page-wrapper").addClass("toggled");
            });

        });
